# Set the local dataset path with --data-path.
dataset: meteo
img_size: 128
frames_in: 5
frames_out: 20
stride: 13
dim: 64
layers: 3
ie_layers: 3
spec_num: 20
epochs: 100
batch_size: 4
lr: 0.0001
beta1: 0.9
beta2: 0.95
weight_decay: 0.0
warmup_steps: 1000
scheduler: cosine
grad_acc_step: 1
mixed_precision: "no"
pha_weight: 0.01
amp_weight: 0.01
anet_weight: 0.1
aw_stop_step: 5000
ema: true
ema_rate: 0.95
use_ema: false
seed: 0
num_workers: 4
